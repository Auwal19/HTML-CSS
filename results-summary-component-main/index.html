<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>


  <div class="container">

  <div class="border1">

    <h1>Your Results</h1>

    <div class="circle">
      <h1>76</h1>
      <p>of 100</p>
    </div>

    <div class="text">
      <h1>Great</h1>
      <p>You scored higher than 65% of<br> the people who have taken<br> these tests.</p>
  </div>
</div>

  <div class="summary">
    <h1>Summary</h1>

      <div class="reaction">
        <img src="./assets/images/icon-reaction.svg" alt="reaction icon">
        <p>Reaction</p>
        <p>80<span>/100</span></p>
      </div>

      <div class="memory">
        <img src="./assets/images/icon-memory.svg" alt="memory icon">
        <p>Memory</p>
        <p>92<span>/100</span></p>
      </div>

      <div class="verbal">
        <img src="./assets/images/icon-verbal.svg" alt="verbal icon">
        <p>Verbal</p>
        <p>61<span>/100</span></p>
      </div>

      <div class="visual">
        <img src="./assets/images/icon-visual.svg" alt="visual icon">
        <p>Visual</p>
        <p>72<span>/100</span></p>
      </div>

      <button class="continue">Continue</button>

    </div>
  </div>

</div>

</body>
</html>
